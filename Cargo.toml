[package]
edition = "2024"
name = "leveler"
version = "0.1.0"
resolver = "2"

[features]
default = []

[dependencies]
embassy-nrf = { version = "0.11", features = ["defmt", "time-driver-rtc1", "nrf52840"] }
nrf-sdc = { version = "0.4", default-features = false, features = ["defmt", "peripheral", "nrf52840"] }
nrf-mpsl = { version = "0.4", default-features = false, features = ["defmt", "critical-section-impl", "nrf52840"] }

embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-time = { version = "0.5.1", default-features = false, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures = "0.1.2"
embassy-sync = { version = "0.8", features = ["defmt"] }
panic-probe = { version = "1.0", features = ["print-defmt"] }

defmt = { version = "1" }
defmt-rtt = "1"

static_cell = "2"
cortex-m = { version = "0.7.6" }
cortex-m-rt = "0.7.0"

# bluetooth
trouble-host = {version="0.8.0", features=["defmt", "derive", "gatt"]}

bt-hci = { version = "0.10.1", default-features = false, features = ["defmt"] }
libm = "0.2.16"
micromath = "2.1.0"

# rtc
# ds323x = "0.6"
# chrono = { version = "0.4", default-features = false }


[build-dependencies]
reqwest = { version = "0.13", features = ["blocking"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"
# debug = "none"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = "full"
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
